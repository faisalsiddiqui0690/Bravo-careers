apiVersion: apps/v1
kind: Deployment
metadata:
  name: technologies-frontend
  namespace: production
  labels:
    app: technologies-frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0
  progressDeadlineSeconds: 600
  minReadySeconds: 10
  selector:
    matchLabels:
      app: technologies-frontend
  template:
    metadata:
      labels:
        app: technologies-frontend
    spec:
      terminationGracePeriodSeconds: 90
      nodeSelector:
        agentpool: prodpoolv2
      containers:
        - name: technologies-frontend
          image: acripshopyprod.azurecr.io/technologies-frontend:IMAGE_TAG
          imagePullPolicy: IfNotPresent        # was Always — no more 10-30s ACR pull on restart
          ports:
            - containerPort: 80
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "80"
          resources:
            requests:
              cpu: "10m"
              memory: "100Mi"
            limits:
              cpu: "50m"
              memory: "500Mi"
          startupProbe:                        
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 20             
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 0          
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 0          
            periodSeconds: 30
            failureThreshold: 5
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: technologies-frontend-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: technologies-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
